name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.24.x", "stable"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: vet
        run: go vet ./...
      - name: test with the race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

  checks:
    name: format, lint, dependencies, vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: zero dependencies in the root module
        run: |
          # The library imports nothing outside the standard library.
          if [ "$(go list -m all | wc -l)" -ne 1 ]; then go list -m all; exit 1; fi
      - name: staticcheck
        # staticcheck 0.8.1 cannot yet read the package export data written by
        # Go 1.27.2 ("export data version 5"). Analysis does not need the
        # security patch, so it runs on 1.27.1; tests and govulncheck stay on
        # the latest release. Remove the pin once staticcheck supports 1.27.2.
        env:
          GOTOOLCHAIN: go1.27.1
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  modules:
    name: example backend, benchmark harness, CLI templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: test the other modules
        run: |
          for m in examples/openai-backend bench/baseline bench/stream; do
            echo "== $m"; (cd "$m" && go vet ./... && go test -short ./...)
          done
      - name: scaffold and build every photon init template
        run: make templates

  fuzz:
    name: fuzz (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test -run '^$' -fuzz FuzzFind -fuzztime 60s ./internal/tree
      - run: go test -run '^$' -fuzz FuzzSSEEventRoundTrip -fuzztime 60s .
